name: Build PCTimeLogger.exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Sample the active window on Windows
        run: python -c "from pctimelogger.platform_win import WindowsSampler; print(WindowsSampler().sample())"

      - name: Build exe
        run: |
          python -m pctimelogger.icon icon.ico
          pyinstaller --onefile --noconsole --name PCTimeLogger --icon icon.ico --hidden-import pystray._win32 PCTimeLogger.py

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist\PCTimeLogger.exe -ArgumentList "info" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: PCTimeLogger
          path: dist/PCTimeLogger.exe

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: PC ajalogija 0.2.${{ github.run_number }}
          body: Laadi alla PCTimeLogger.exe ja käivita see. Programm paigaldab end ise vana versiooni peale.
          files: dist/PCTimeLogger.exe
          make_latest: true
